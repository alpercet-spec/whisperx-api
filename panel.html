<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WhisperX Panel</title>
<link rel="stylesheet" href="/ui/ortak.css">
<script src="/ui/ortak.js" defer></script>
<style>
.drop{border:2px dashed var(--line);border-radius:var(--r);padding:38px 20px;text-align:center;color:var(--muted);cursor:pointer;transition:.15s;background:var(--line2)}
  .drop b{color:var(--text);font-weight:600}
  .drop.over{border-color:var(--accent);color:var(--accent-text);background:var(--accent-weak)}
  .b-wait{background:var(--line2);color:var(--muted)}.b-run{background:var(--warnbg);color:var(--warn);border-color:transparent}.b-ok{background:var(--okbg);color:var(--ok);border-color:transparent}.b-err{background:var(--errbg);color:var(--err);border-color:transparent}
  .dialogue{white-space:pre-wrap;font-family:var(--mono);font-size:13px;background:var(--line2);padding:14px;border-radius:var(--r-sm);max-height:460px;overflow:auto}
  .sp0{color:#0369a1}.sp1{color:#b45309}.sp2{color:#7c3aed}.sp3{color:#be185d}
  .actions{display:flex;gap:6px;flex-wrap:wrap}
  .scores{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin:14px 0}
  .score{background:var(--line2);border-radius:var(--r-sm);padding:12px;text-align:center}
  .score .v{font-size:22px;font-weight:700}.score .k{font-size:12px;color:var(--muted)}
  .big{font-size:40px;font-weight:800;color:var(--accent-text);line-height:1}
  .an h3{margin:16px 0 6px;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
  .an ul{margin:0;padding-left:18px}.warn{background:var(--errbg);color:var(--err);padding:10px 12px;border-radius:var(--r-sm)}
  .tblwrap{overflow-x:auto}
  .settings{display:flex;gap:16px;flex-wrap:wrap;align-items:flex-end}
  .settings label{display:grid;gap:4px}
</style>
</head>
<body>
<header class="topbar">
  <div style="min-width:0"><h1>Ses → metin</h1><div class="sub" id="status">bağlantı kontrol ediliyor…</div></div>
</header>
<main>
  <div class="card">
    <div class="settings">
      <label>Dil<select id="lang"><option value="tr">Türkçe</option><option value="en">English</option><option value="de">Deutsch</option><option value="ar">العربية</option><option value="ru">Русский</option></select></label>
      <label>Konuşmacı sayısı<span class="row" style="flex-wrap:nowrap"><input type="number" id="minsp" value="2" min="1" max="10" style="width:70px"> – <input type="number" id="maxsp" value="2" min="1" max="10" style="width:70px"></span></label>
      <button class="secondary" onclick="saveSettings()">Ayarları kaydet</button>
    </div>
    <p class="small">Ayarlar bu tarayıcıda saklanır. Çağrı merkezi kayıtları için 2–2 bırak (müşteri + temsilci).</p>
  </div>

  <div class="card">
    <div class="drop" id="drop"><b>Ses dosyalarını buraya sürükle ya da tıkla</b><br><span class="small">mp3, wav, m4a, ogg, webm, mp4 — birden fazla seçebilirsin</span>
      <input type="file" id="file" multiple accept="audio/*,video/mp4,.mp3,.wav,.m4a,.ogg,.webm,.mp4" hidden>
    </div>
    <div class="row" style="margin-top:12px">
      <button id="start" onclick="startQueue()" disabled>İşlemeyi başlat</button>
      <button class="secondary" onclick="clearDone()">Bitenleri temizle</button>
      <button class="secondary" onclick="downloadAll()">Tümünü indir (JSON)</button>
      <span class="small" id="qinfo"></span>
    </div>
  </div>

  <div class="card tblwrap">
    <table>
      <thead><tr><th>Dosya</th><th>Boyut</th><th>Durum</th><th>Süre</th><th>İşlem</th></tr></thead>
      <tbody id="rows"></tbody>
    </table>
  </div>

  <div class="card" id="result" hidden>
    <div class="row" style="justify-content:space-between">
      <strong id="rtitle"></strong>
      <div class="actions">
        <button onclick="analyze()" id="anbtn">Analiz et</button>
        <button class="secondary" onclick="copyText()">Metni kopyala</button>
        <button class="secondary" onclick="dl('txt')">TXT indir</button>
        <button class="secondary" onclick="dl('json')">JSON indir</button>
      </div>
    </div>
    <div class="dialogue" id="rdialogue" style="margin-top:10px"></div>
    <div id="analysis" hidden style="margin-top:16px"></div>
  </div>
</main>

<script>
const $=s=>document.querySelector(s);
const queue=[]; let running=false, current=null;
const fmt=b=>b>1048576?(b/1048576).toFixed(1)+' MB':(b/1024).toFixed(0)+' KB';
const hhmm=s=>{s=Math.round(s);return (Math.floor(s/60))+':'+String(s%60).padStart(2,'0')};

function loadSettings(){try{const s=JSON.parse(localStorage.getItem('wx_settings')||'{}');if(s.lang)$('#lang').value=s.lang;if(s.min)$('#minsp').value=s.min;if(s.max)$('#maxsp').value=s.max;}catch(e){}}
function saveSettings(){try{localStorage.setItem('wx_settings',JSON.stringify({lang:$('#lang').value,min:$('#minsp').value,max:$('#maxsp').value}));$('#status').textContent='ayarlar kaydedildi';}catch(e){}}
loadSettings();

fetch('/health').then(r=>r.json()).then(j=>$('#status').textContent='servis hazır · model: '+j.model).catch(()=>$('#status').textContent='servise ulaşılamıyor');

const drop=$('#drop'), fileIn=$('#file');
drop.onclick=()=>fileIn.click();
drop.ondragover=e=>{e.preventDefault();drop.classList.add('over')};
drop.ondragleave=()=>drop.classList.remove('over');
drop.ondrop=e=>{e.preventDefault();drop.classList.remove('over');addFiles(e.dataTransfer.files)};
fileIn.onchange=()=>{addFiles(fileIn.files);fileIn.value=''};

function addFiles(list){for(const f of list){queue.push({id:Date.now()+Math.random(),file:f,status:'wait',result:null,secs:0});}render();}
function render(){
  const tb=$('#rows');tb.innerHTML='';
  for(const q of queue){
    const tr=document.createElement('tr');
    const badge={wait:'<span class="badge b-wait">bekliyor</span>',run:'<span class="badge b-run">işleniyor…</span>',ok:'<span class="badge b-ok">tamam</span>',err:'<span class="badge b-err">hata</span>'}[q.status];
    let act='';
    if(q.status==='ok')act=`<button class="secondary" onclick="show('${q.id}')">Göster</button>`;
    if(q.status==='err')act=`<span class="small">${q.error||''}</span> <button class="secondary" onclick="retry('${q.id}')">Tekrar</button>`;
    if(q.status==='wait')act=`<button class="secondary" onclick="remove('${q.id}')">Kaldır</button>`;
    tr.innerHTML=`<td>${q.file.name}</td><td>${fmt(q.file.size)}</td><td>${badge}</td><td>${q.secs?hhmm(q.secs):''}</td><td class="actions">${act}</td>`;
    tb.appendChild(tr);
  }
  const waiting=queue.filter(q=>q.status==='wait').length;
  $('#start').disabled=running||waiting===0;
  $('#qinfo').textContent=waiting?`${waiting} dosya sırada`:(running?'çalışıyor':'');
}
function remove(id){const i=queue.findIndex(q=>q.id==id);if(i>-1)queue.splice(i,1);render()}
function retry(id){const q=queue.find(q=>q.id==id);if(q){q.status='wait';q.error='';render();}}
function clearDone(){for(let i=queue.length-1;i>=0;i--)if(queue[i].status==='ok')queue.splice(i,1);render()}

async function startQueue(){
  if(running)return; saveSettings(); running=true; render();
  for(const q of queue){
    if(q.status!=='wait')continue;
    q.status='run';render();
    const t0=Date.now(); const timer=setInterval(()=>{q.secs=(Date.now()-t0)/1000;render()},1000);
    try{
      const fd=new FormData();
      fd.append('file',q.file,q.file.name);
      fd.append('language',$('#lang').value);
      fd.append('min_speakers',$('#minsp').value);
      fd.append('max_speakers',$('#maxsp').value);
      const r=await fetch('/transcribe',{method:'POST',body:fd});
      if(!r.ok){if(r.status===401){location.href='/login';return} throw new Error('HTTP '+r.status)}
      q.result=await r.json(); q.status='ok';
      try{const hist=JSON.parse(localStorage.getItem('wx_history')||'[]');hist.unshift({name:q.file.name,date:new Date().toISOString(),result:q.result});localStorage.setItem('wx_history',JSON.stringify(hist.slice(0,50)));}catch(e){}
    }catch(e){q.status='err';q.error=e.message}
    clearInterval(timer); q.secs=(Date.now()-t0)/1000; render();
    if(q.status==='ok')show(q.id);
  }
  running=false; render();
}

function colorize(d){return d.replace(/\[SPEAKER_(\d+)\]/g,(m,n)=>`<span class="sp${n%4}">[Konuşmacı ${+n+1}]</span>`)}
function show(id){current=queue.find(q=>q.id==id);if(!current)return;$('#result').hidden=false;$('#rtitle').textContent=current.file.name;$('#rdialogue').innerHTML=colorize(escapeHtml(current.result.dialogue||current.result.text||''));const an=$('#analysis');if(current.result.analysis){an.hidden=false;renderAnalysis(current.result.analysis)}else{an.hidden=true;an.innerHTML=''}$('#result').scrollIntoView({behavior:'smooth'})}
function escapeHtml(s){return s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}
async function analyze(){
  if(!current)return; const btn=$('#anbtn'); btn.disabled=true; btn.textContent='Analiz ediliyor…';
  const box=$('#analysis'); box.hidden=false; box.innerHTML='<span class="small">Claude görüşmeyi değerlendiriyor (20-40 sn)…</span>';
  try{
    const r=await fetch('/analyze',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({dialogue:current.result.dialogue})});
    if(r.status===401){location.href='/login';return}
    const a=await r.json(); if(!r.ok)throw new Error(a.detail||('HTTP '+r.status));
    current.result.analysis=a; renderAnalysis(a);
  }catch(e){box.innerHTML='<div class="warn">Analiz hatası: '+escapeHtml(e.message)+'</div>'}
  btn.disabled=false; btn.textContent='Analiz et';
}
function renderAnalysis(a){
  const box=$('#analysis'); if(a.ham){box.innerHTML='<pre class="dialogue">'+escapeHtml(a.ham)+'</pre>';return}
  const names={karsilama:'Karşılama',dinleme_ve_anlama:'Dinleme & anlama',bilgi_dogrulugu:'Bilgi doğruluğu',satis_ve_yonlendirme:'Satış & yönlendirme',nezaket_ve_ton:'Nezaket & ton',kapanis:'Kapanış'};
  const sp=a.temsilci?String(a.temsilci).replace(/SPEAKER_(\d+)/,(m,n)=>'Konuşmacı '+(+n+1)):'?';
  let h='<div class="an"><div class="row" style="gap:20px;align-items:center"><div class="big">'+(a.genel_puan??'–')+'<span class="small">/100</span></div><div><div><b>Temsilci:</b> '+escapeHtml(sp)+' · <b>Sonuç:</b> '+escapeHtml(a.sonuc||'')+'</div><div class="small">'+escapeHtml(a.ozet||'')+'</div></div></div>';
  if(a.uyari)h+='<div class="warn" style="margin-top:10px">⚠ '+escapeHtml(a.uyari)+'</div>';
  h+='<div class="scores">'+Object.entries(a.puanlar||{}).map(([k,v])=>'<div class="score"><div class="v">'+v+'</div><div class="k">'+(names[k]||k)+'</div></div>').join('')+'</div>';
  h+='<h3>Müşteri talebi</h3><div>'+escapeHtml(a.musteri_talebi||'')+'</div>';
  if(a.guclu_yonler?.length)h+='<h3>Güçlü yönler</h3><ul>'+a.guclu_yonler.map(x=>'<li>'+escapeHtml(x)+'</li>').join('')+'</ul>';
  if(a.gelistirilecekler?.length)h+='<h3>Geliştirilecekler</h3><ul>'+a.gelistirilecekler.map(x=>'<li>'+escapeHtml(x)+'</li>').join('')+'</ul>';
  if(a.kacirilan_firsat)h+='<h3>Kaçırılan fırsat</h3><div>'+escapeHtml(a.kacirilan_firsat)+'</div>';
  box.innerHTML=h+'</div>';
}
function copyText(){if(current)navigator.clipboard.writeText(current.result.dialogue||'').then(()=>$('#status').textContent='kopyalandı')}
function dl(type){if(!current)return;const base=current.file.name.replace(/\.[^.]+$/,'');const blob=type==='txt'?new Blob([current.result.dialogue],{type:'text/plain'}):new Blob([JSON.stringify(current.result,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=base+'.'+type;a.click()}
function downloadAll(){const done=queue.filter(q=>q.status==='ok').map(q=>({file:q.file.name,...q.result}));if(!done.length){alert('Henüz tamamlanan dosya yok.');return}const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(done,null,2)],{type:'application/json'}));a.download='whisperx-sonuclar.json';a.click()}
</script>
</body>
</html>
